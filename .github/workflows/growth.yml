name: Growth

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: growth/package-lock.json

      - name: Use npm 11.21.1
        run: npm install -g npm@11.21.1

      - name: Install growth package
        run: npm ci --ignore-scripts --prefix growth

      - name: Restore previous snapshots from growth-data
        env:
          GROWTH_DATA_BRANCH: growth-data
        run: |
          set -euo pipefail
          mkdir -p growth/data/snapshots growth/reports /tmp/growth-history
          if git ls-remote --exit-code --heads origin "$GROWTH_DATA_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$GROWTH_DATA_BRANCH"
            git checkout "origin/$GROWTH_DATA_BRANCH" -- growth/data growth/reports 2>/dev/null || true
          fi

      - name: Build growth agent
        run: npm --prefix growth run build

      - name: Run weekly growth pipeline
        env:
          GROWTH_PUBLISH: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GROWTH_DATA_BRANCH: growth-data
        run: npm --prefix growth start

      - name: Stage artifacts for growth-data branch
        run: |
          set -euo pipefail
          rm -rf /tmp/growth-artifacts
          mkdir -p /tmp/growth-artifacts
          cp -R growth/data /tmp/growth-artifacts/data
          cp -R growth/reports /tmp/growth-artifacts/reports

      - name: Commit artifacts to growth-data
        env:
          GROWTH_DATA_BRANCH: growth-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$GROWTH_DATA_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$GROWTH_DATA_BRANCH" "origin/$GROWTH_DATA_BRANCH"
          else
            git checkout --orphan "$GROWTH_DATA_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p growth
          rm -rf growth/data growth/reports
          cp -R /tmp/growth-artifacts/data growth/data
          cp -R /tmp/growth-artifacts/reports growth/reports
          printf '%s\n' '# Growth data branch' '' 'Weekly snapshots and reports produced by `.github/workflows/growth.yml`.' '' > README.md

          git add README.md growth/data growth/reports
          if git diff --cached --quiet; then
            echo "No growth artifact changes to commit."
            exit 0
          fi
          git commit -m "chore(growth): weekly snapshot $(date -u +%F)"
          git push origin "HEAD:$GROWTH_DATA_BRANCH"
